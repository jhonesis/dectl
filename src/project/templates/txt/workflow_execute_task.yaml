name: execute_task
description: "Full SDD task execution pipeline: research -> code context -> implement -> review -> document -> close"
inputs:
  - name: task_id
    description: "Task identifier (e.g. T001)"
    required: true
  - name: description
    description: "Task description"
    required: true
steps:
  - type: agent
    description: "Investigate context and relevant memory for the task"
    agent_type: researcher
    task: "{{description}}"

  - type: agent
    description: "Prepare context for implementation"
    agent_type: coder
    task: "{{description}}"

  - type: prompt
    description: "AI model implements the changes"
    content: |
      ## Task {{task_id}}: {{description}}

      ### Implementation Phase
      1. Read `.dec/agent-output/{{task_id}}-coder-context.md` for context
      2. Read `.dec/agent-output/{{task_id}}-research.md` for research findings
      3. Implement the changes following project conventions

      ### REQUIRED: Complete the Task Cycle
      After implementation is complete, run EXACTLY this command:

      ```bash
      dectl workflow run execute_task \
        --var task_id={{task_id}} \
        --var description="{{description}}" \
        --from-step 4 --auto
      ```

      **WARNING: Skipping this command will cause:**
      - No build/test/lint verification
      - No memory recording
      - No progress.json update
      - Incomplete task cycle

      Run the command above before finishing.

  - type: agent
    description: "Build + diff + verification"
    agent_type: reviewer
    task: "{{description}}"
    run_always: true

  - type: agent
    description: "Register decision and close the task cycle"
    agent_type: documenter
    task: "{{description}}"
    run_always: true

  - type: prompt
    description: "Final verification - check state files are synced"
    run_always: true
    content: |
      ## FINAL VERIFICATION — Do these 3 checks NOW:

      1. **progress.json**: Read `.dec/state/progress.json`
         → Should show an entry with `id: "{{task_id}}"` and `status: "done"`, and `updated_at` updated.
      2. **last_session.md**: Read `.dec/state/last_session.md`
         → Should show {{task_id}} under the completed-tasks section.
      3. **tasks.md (only if it exists)**: Run `find specs -name tasks.md -type f`
         → If a tasks.md exists AND it lists {{task_id}}, that task must be checked `[x]`.
         → If there is no tasks.md, or {{task_id}} is not listed there, this check is satisfied.

      If ANY check fails, fix it before ending the session.

  - type: action
    description: "Hard gate: verify state files are synced"
    shell: true
    run_always: true
    cmd:
      - |
        P=.dec/state/progress.json; S=.dec/state/last_session.md; T='{{task_id}}'; ok=0
        grep -qiF "\"id\": \"$T\"" "$P" 2>/dev/null && grep -qi '"status": "done"' "$P" 2>/dev/null && ok=$((ok+1))
        grep -qiF "$T" "$S" 2>/dev/null && ok=$((ok+1))
        TM=$(find specs -name tasks.md -type f 2>/dev/null)
        if [ -z "$TM" ] || ! grep -qiF "$T" $TM 2>/dev/null; then
          ok=$((ok+1))
        elif grep -iF "$T" $TM 2>/dev/null | grep -q "\[x\]"; then
          ok=$((ok+1))
        fi
        if [ "$ok" -eq 3 ]; then echo STATE_OK; else echo STATE_MISSING; exit 1; fi
