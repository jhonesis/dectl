name: execute_task
description: "Full SDD task execution pipeline: research -> code context -> implement -> review -> document -> close"
inputs:
  - name: task_id
    description: "Task identifier (e.g. T001)"
    required: true
  - name: description
    description: "Task description"
    required: true
  - name: step_4_output
    description: "Reviewer agent execution result (populated by the workflow)"
    required: false
    default: ""
steps:
  - type: agent
    description: "Investigate context and relevant memory for the task"
    agent_type: researcher
    task: "{{description}}"

  - type: agent
    description: "Prepare context for implementation"
    agent_type: coder
    task: "{{description}}"

  - type: prompt
    description: "AI model implements the changes"
    content: |
      ## Task {{task_id}}: {{description}}

      ### Implementation Phase
      1. Read `.dec/agent-output/{{task_id}}-coder-context.md` for context
      2. Read `.dec/agent-output/{{task_id}}-research.md` for research findings
      3. Implement the changes following project conventions

      ### REQUIRED: Complete the Task Cycle
      After implementation is complete, run EXACTLY this command:

      ```bash
      dectl workflow run execute_task \
        --var task_id={{task_id}} \
        --var description="{{description}}" \
        --from-step 4 --auto
      ```

      **WARNING: Skipping this command will cause:**
      - No build/test/lint verification
      - No memory recording
      - No progress.json update
      - Incomplete task cycle

      Run the command above before finishing.

  - type: agent
    description: "Build + diff + verification"
    agent_type: reviewer
    task: "{{description}}"
    run_always: true

  - type: agent
    description: "Register decision and close the task cycle"
    agent_type: documenter
    task: "{{description}}"
    run_always: true

  - type: prompt
    description: "Final verification - check state files are synced"
    run_always: true
    content: |
      ## FINAL REVIEW AND STATE VERIFICATION

      Review the reviewer analysis and command results from this workflow. The
      documenter must have written `.dec/agent-output/{{task_id}}-review-status.txt`
      with exactly `PASS` or `FAIL` on its first line. Missing or ambiguous status
      is `FAIL`.

      Reviewer agent execution result from step 4:
      ```
      {{step_4_output}}
      ```
      If step 4 reports an agent failure or timeout, the verdict MUST be `FAIL`,
      even if no review report was produced. A successful documenter does not
      override a failed reviewer.

      - `PASS` only when spec review, build, tests, lint, and the rules gate all
        pass (a rules gate `SKIP` is acceptable when no rules are configured).
      - `FAIL` if any required check fails, the reviewer identifies an unresolved
        blocker, or the verdict is uncertain.

      For `PASS`, ensure `progress.json` is `done`, `last_session.md` records the
      task as completed, and the matching `tasks.md` checkbox is `[x]` when listed.
      Add a completion memory entry.

      For `FAIL`, ensure `progress.json` is `in_progress`, `last_session.md`
      records an attempt and its review failure, and the matching `tasks.md`
      checkbox remains `[ ]` when listed. Preserve the review report and attempt
      artifacts. Do not add a completion memory entry.

      After the status file and state agree, resume the workflow to run its hard
      gate:
        dectl workflow run execute_task --var task_id={{task_id}} --var description="{{description}}" --from-step 7 --auto

  - type: action
    description: "Hard gate: verify review verdict and state agree"
    shell: true
    run_always: true
    cmd:
      - |
        P=.dec/state/progress.json; S=.dec/state/last_session.md; T='{{task_id}}'
        R=".dec/agent-output/${T}-review-status.txt"
        REVIEW_STATUS=$(sed -n '1p' "$R" 2>/dev/null || true)
        PROGRESS_STATUS=$(awk -v id="$T" 'BEGIN { RS="}" } $0 ~ ("\"id\"[[:space:]]*:[[:space:]]*\"" id "\"") { if ($0 ~ /"status"[[:space:]]*:[[:space:]]*"done"/) print "done"; else if ($0 ~ /"status"[[:space:]]*:[[:space:]]*"in_progress"/) print "in_progress"; else print "other"; exit }' "$P" 2>/dev/null)
        TM=$(find . -name tasks.md -type f -not -path '*/node_modules/*' -not -path '*/target/*' -not -path '*/.git/*' 2>/dev/null | head -5)
        TASK_STATE=not_listed
        for F in $TM; do
          LINE=$(grep -E "^[[:space:]]*- \[[ x]\] \[$T\]" "$F" 2>/dev/null | head -1 || true)
          if [ -n "$LINE" ]; then
            case "$LINE" in *"- [x]"*) TASK_STATE=done ;; *"- [ ]"*) TASK_STATE=pending ;; esac
            break
          fi
        done

        if [ "$REVIEW_STATUS" = "PASS" ]; then
          [ "$PROGRESS_STATUS" = "done" ] || { echo STATE_MISSING: progress is not done; exit 1; }
          grep -qiF "$T" "$S" 2>/dev/null || { echo STATE_MISSING: session entry; exit 1; }
          [ "$TASK_STATE" != "pending" ] || { echo STATE_MISSING: task checkbox; exit 1; }
          echo STATE_OK
          exit 0
        fi

        if [ "$REVIEW_STATUS" = "FAIL" ]; then
          [ "$PROGRESS_STATUS" = "in_progress" ] || { echo STATE_MISMATCH: failed task must remain in_progress; exit 1; }
          grep -qiF "$T" "$S" 2>/dev/null || { echo STATE_MISSING: attempt entry; exit 1; }
          [ "$TASK_STATE" != "done" ] || { echo STATE_MISMATCH: failed task is checked; exit 1; }
          echo REVIEW_FAIL_TASK_PENDING
          exit 1
        fi

        echo REVIEW_STATUS_MISSING_OR_INVALID
        exit 1
