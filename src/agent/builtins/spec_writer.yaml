name: spec_writer
role: "SDD spec guide for AI agents"
description: >
  Guides an AI agent to create or update SDD specs using .dec/sdd/SKILL.md as source
  and guide. Module scope: create specs/<name>/ with constitution.md, spec.md,
  requirements.md, plan.md, tasks.md. Feature scope: update existing specs/spec.md
  and specs/tasks.md. Used by `dectl spec add`.
requires: []
context_files:
  - ".dec/config/project.toml"
  - ".dec/sdd/SKILL.md"
  - ".dec/sdd/references/templates.md"
  - ".dec/sdd/references/examples.md"
inputs:
  - name: from_content
    description: "Content from source file (--from flag)"
    required: false
    default: ""
  - name: profile
    description: "Content profile selected with --profile (empty = complete suite)"
    required: false
    default: ""
  - name: profile_marker
    description: "Pre-rendered content-profile marker (empty = complete suite)"
    required: false
    default: ""
next_step_hint: "After guidance, the AI agent creates/updates the specs. Verify: ls specs/"
steps:
  - type: action
    description: Check SDD skill file exists
    shell: true
    run_always: true
    cmd: ["cat .dec/sdd/SKILL.md 2>/dev/null || echo 'NO_SDD_SKILL'"]

  - type: action
    description: Check SDD templates file exists
    shell: true
    run_always: true
    cmd: ["cat .dec/sdd/references/templates.md 2>/dev/null || echo 'NO_SDD_TEMPLATES'"]

  - type: action
    description: Check SDD examples file exists
    shell: true
    run_always: true
    cmd: ["cat .dec/sdd/references/examples.md 2>/dev/null || echo 'NO_SDD_EXAMPLES'"]

  - type: action
    description: List existing specs
    shell: true
    run_always: true
    cmd: ["ls -la specs/ 2>/dev/null || echo 'No specs'"]

  - type: action
    description: Read existing spec files
    shell: true
    run_always: true
    cmd: ["find specs/ -name '*.md' -exec head -20 {} \\; 2>/dev/null || echo 'No specs'"]

  - type: action
    description: Search memory
    cmd: ["dectl", "memory", "search", "--json", "{{task}} spec"]

  - type: action
    description: Get timestamp
    shell: true
    cmd: ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]

  - type: action
    description: Read existing spec and tasks to find last IDs
    shell: true
    run_always: true
    cmd: ["LAST_REQ=$(grep -oE 'REQ-[0-9]+' specs/spec.md 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1 || echo '0'); LAST_TASK=$(grep -oE 'T[0-9]+' specs/tasks.md 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1 || echo '0'); REQ_NUM=$(printf '%s' \"$LAST_REQ\" | sed 's/^0*//'); [ -z \"$REQ_NUM\" ] && REQ_NUM=0; TASK_NUM=$(printf '%s' \"$LAST_TASK\" | sed 's/^0*//'); [ -z \"$TASK_NUM\" ] && TASK_NUM=0; NREQ=$(printf '%03d' $((REQ_NUM + 1))); NTASK=$(printf '%03d' $((TASK_NUM + 1))); echo last_req=$LAST_REQ last_task=$LAST_TASK next_req=$NREQ next_task=$NTASK"]

  - type: prompt
    description: Module spec guidance
    skip_if: "{{#if_eq scope \"feature\"}}true{{/if_eq}}"
    content: |
      ## MODULE SPEC GUIDANCE

      You are the spec_writer. Generate the SDD document suite for the module "{{name}}"
      using the SDD skill as the source and guide. dectl does not create these files
      for you — you must create them.

      {{#if from_content}}
      [SOURCE FILE CONTENT — read first]
      {{from_content}}
      [/SOURCE FILE CONTENT]
      Preserve the requirement IDs from the source file. Do NOT renumber them.
      {{/if}}

      {{#if profile}}
      A content profile is selected, so it REPLACES the default document list:
      do NOT create `specs/{{name}}/` and do NOT generate the default five documents.
      Create only the documents listed in the content-profile block at the end of this
      message, at the project specs root, and report the excluded ones with their reason.
      {{else}}
      Create exactly these files under `specs/{{name}}/`, following the templates
      EXACTLY (keep every section; fill the placeholders with module-specific content):
      1. constitution.md
      2. spec.md
      3. requirements.md
      4. plan.md
      5. tasks.md
      {{/if}}

      Rules:
      {{#if profile}}
      - Preserve the template sections of the documents you generate: User Stories with
        SHALL acceptance criteria, declared shapes, etc.
      - spec.md is technology-agnostic (WHAT); any technology decision belongs in code, not in the generated set.
      - Precedence: SKILL prevails over local convention (SKILL prevalece sobre convención local) — do not imitate existing specs if they conflict with the skill.
      - Use sequential IDs: `REQ-{{name}}-001`, ... for the generated requirements.
      - Shapes are mandatory: a document that does not match its declared shape is not consumable.
      {{else}}
      - Preserve every template section: Definition of Done, User Stories with SHALL
        acceptance criteria, Edge Case Catalog, Build/Verify/Gate per task, etc.
      - spec.md is technology-agnostic (WHAT); plan.md is technology-specific (HOW).
      - Precedence: SKILL prevails over local convention (SKILL prevalece sobre convención local) — do not imitate existing specs if they conflict with the skill.
      - Use sequential IDs: `REQ-{{name}}-001`, ..., and `T001`, `T002`, ... in tasks.md.
      - Every task has **Build**: + **Verify**: + **Gate**:.
      {{/if}}

      READING CHECKLIST — BLOCKING (do not write any file until all three are read):
      - `.dec/sdd/SKILL.md` — SDD workflow (Steps 1–5) and document rules
      - `.dec/sdd/references/templates.md` — full document templates
      - `.dec/sdd/references/examples.md` — worked examples

      {{#if profile}}
      When the documents listed by the content profile are done, also append a reference
      REQ entry to root `specs/spec.md` pointing to the generated set.

      CONTRACT CHECKLIST — BLOCKING after writing: walk the checklist in the
      content-profile block below one row at a time. Every entity, endpoint, rule and
      access requirement from the source must appear at its declared destination.
      Record every element that does not map directly in the non-fit list using the
      schema declared by the emitting system; never drop it. For the repeatable audit:
        dectl workflow run spec_contract --var name={{name}}
      {{else}}
      When the 5 files are done, also append:
      - A reference REQ entry to root `specs/spec.md` pointing to `specs/{{name}}/`.
      - A module task to root `specs/tasks.md` (with Build/Verify/Gate).
      {{/if}}
      {{profile_marker}}

  - type: prompt
    description: Feature spec guidance
    skip_if: "{{#if_eq scope \"module\"}}true{{/if_eq}}"
    content: |
      ## FEATURE SPEC GUIDANCE

      You are the spec_writer. Update the existing project specs for the feature
      "{{name}}" using the SDD skill as the source and guide. dectl does not update
      these files for you — you must do it.

      {{#if from_content}}
      [SOURCE FILE CONTENT — read first]
      {{from_content}}
      [/SOURCE FILE CONTENT]
      Preserve the requirement IDs from the source file. Do NOT renumber them.
      {{/if}}

      {{#if profile}}
      Do NOT create a `specs/{{name}}/` subdirectory. A content profile is selected,
      so it decides which documents are generated:

      1. `specs/spec.md` — append a new requirement block `REQ-{{next_req}}` for the
         feature {{name}}, following the spec.md template (User Story, Acceptance
         Criteria with SHALL, Implementation Notes).
      2. Create or update the remaining documents listed in the content-profile block
         at the end of this message, honouring the declared shape. Do NOT create any
         document the profile excludes (for example `specs/tasks.md` may be excluded).

      CONTRACT CHECKLIST — BLOCKING after writing: walk the checklist in the
      content-profile block below one row at a time. Every entity, endpoint, rule and
      access requirement from the source must appear at its declared destination.
      Record every element that does not map directly in the non-fit list using the
      schema declared by the emitting system; never drop it. For the repeatable audit:
        dectl workflow run spec_contract --var name={{name}}
      {{else}}
      Do NOT create a `specs/{{name}}/` subdirectory. Instead:

      1. `specs/spec.md` — append a new requirement block `REQ-{{next_req}}` for the
         feature {{name}}, following the spec.md template (User Story, Acceptance
         Criteria with SHALL, Implementation Notes).
      2. `specs/tasks.md` — append atomic tasks for the feature starting at
         `T{{next_task}}`, each with **Build**: + **Verify**: + **Gate**:, and
         referencing `REQ-{{next_req}}`.
      {{/if}}

      Precedence: SKILL prevails over local convention (SKILL prevalece sobre convención local) — do not imitate existing specs if they conflict with the skill.

      READING CHECKLIST — BLOCKING (do not write any file until all three are read):
      - `.dec/sdd/SKILL.md` — SDD workflow and document rules
      - `.dec/sdd/references/templates.md` — full document templates
      - `.dec/sdd/references/examples.md` — worked examples
      {{profile_marker}}

  - type: prompt
    description: Closing reminder
    run_always: true
    content: |
      ## Spec guidance complete — {{task}}

      Use the guidance above to create or update the spec documents, guided by
      the required reading list (same three files as in the guidance above):
      - `.dec/sdd/SKILL.md` — SDD workflow and document rules
      - `.dec/sdd/references/templates.md` — full document templates
      - `.dec/sdd/references/examples.md` — worked examples
      {{#if profile}}
      - A content profile is selected: create ONLY the documents it lists, at the
        project specs root. The excluded documents must stay absent and be reported
        with their reason.
      - Walk the contract checklist, keep the non-fit list in the emitter's format,
        and cite origin + destination for every non-fit item.
      {{else}}
      - Module scope: create `specs/{{name}}/` with the 5 SDD documents.
      - Feature scope: update `specs/spec.md` and `specs/tasks.md` (no subdirectory).
      {{/if}}

      Before finishing, validate against SKILL.md Step 4: spec is technology-agnostic,
      {{#if profile}}
      every generated document matches the shape declared by the content profile.
      {{else}}
      every task has Build/Verify/Gate, IDs are sequential.
      {{/if}}
      Precedence: SKILL prevails over local convention (SKILL prevalece sobre convención local). Then record the result:
      `dectl memory add "Specs written for {{name}}" --tags specs,{{scope}}`
      The automated verifier step runs next — if it emits SPEC_GATE_FAIL, fix the
      flagged tech-names / BVG gaps before considering the specs done.

  - type: action
    description: Verify spec is technology-agnostic + tasks carry Build/Verify/Gate (machine gate)
    shell: true
    run_always: true
    cmd: ["bash", "-c", ": gate-init; FAIL=0; SPECS=\"\"; [ -f specs/spec.md ] && SPECS=\"$SPECS specs/spec.md\"; [ -f \"specs/{{name}}/spec.md\" ] && SPECS=\"$SPECS specs/{{name}}/spec.md\"; if [ -z \"$SPECS\" ]; then echo 'SPEC_GATE_SKIP: no spec.md found (agent has not written specs yet)'; else HITS=$(grep -iE 'react|vue|angular|node|postgres|docker|aws|once_cell|bouncycastle|cipher|preauthorize' $SPECS 2>/dev/null || true); if [ -n \"$HITS\" ]; then echo 'SPEC_GATE_FAIL: tech names in spec.md (WHAT-vs-HOW violation):'; echo \"$HITS\"; FAIL=1; else echo 'SPEC_GATE_DETAIL_OK: spec.md technology-agnostic (no denylist hits; only spec.md files scanned)'; fi; fi; TASKS=\"\"; [ -f specs/tasks.md ] && TASKS=\"$TASKS specs/tasks.md\"; [ -f \"specs/{{name}}/tasks.md\" ] && TASKS=\"$TASKS specs/{{name}}/tasks.md\"; if [ -z \"$TASKS\" ]; then echo 'BVG_SKIP: no tasks.md found'; else for f in $TASKS; do for m in Build Verify Gate; do grep -q \"$m\" \"$f\" 2>/dev/null || { echo \"SPEC_GATE_FAIL: $f missing $m markers\"; FAIL=1; }; done; done; [ \"$FAIL\" = 0 ] && echo 'BVG_OK: tasks carry Build/Verify/Gate'; fi; if [ \"$FAIL\" = 0 ]; then echo 'SPEC_GATE_OK: all checks pass'; else echo 'SPEC_GATE_FAIL: fix flagged items and re-run'; fi; exit 0"]
