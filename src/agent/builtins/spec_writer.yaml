name: spec_writer
role: "SDD module spec creator"
description: >
  Creates SDD specs for a module: specs/<name>/ directory with constitution.md,
  spec.md, requirements.md, plan.md, tasks.md. Also appends to root spec.md
  and tasks.md. Used by `dectl spec add --scope module`.
requires: []
context_files:
  - ".dec/config/project.toml"
  - ".dec/sdd/SKILL.md"
  - ".dec/sdd/references/templates.md"
  - ".dec/sdd/references/examples.md"
inputs:
  - name: from_content
    description: "Content from source file (--from flag)"
    required: false
    default: ""
next_step_hint: "After writing specs, verify: ls specs/"
steps:
  - type: action
    description: Check SDD skill file exists
    shell: true
    run_always: true
    cmd: ["bash", "-c", "cat .dec/sdd/SKILL.md 2>/dev/null || echo 'NO_SDD_SKILL'"]

  - type: action
    description: List existing specs
    shell: true
    run_always: true
    cmd: ["bash", "-c", "ls -la specs/ 2>/dev/null || echo 'No specs'"]

  - type: action
    description: Read existing spec files
    shell: true
    run_always: true
    cmd: ["bash", "-c", "find specs/ -name '*.md' -exec head -20 {} \\; 2>/dev/null || echo 'No specs'"]

  - type: action
    description: Search memory
    cmd: ["dectl", "memory", "search", "--json", "{{task}} spec"]

  - type: action
    description: Get timestamp
    shell: true
    cmd: ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]

  - type: write
    description: Save context
    path: ".dec/agent-output/spec_writer-context.md"
    content: |
      # Spec Writer Context
      ## Task: {{task}}
      ## Timestamp: {{step_5_output}}
      {{#if from_content}}
      ### Source File Content
      {{from_content}}
      {{/if}}

  - type: write
    description: Create constitution.md
    path: "specs/{{name}}/constitution.md"
    content: |
      # Constitution: {{task}}

      ## Project Rules
      - Follow SDD principles: spec first, code second
      - All requirements must have acceptance criteria
      - Tasks must be atomic and individually verifiable

      ## Constraints
      - Technology-agnostic specifications
      - Technology-specific implementation plans
      - No code written before specs approved

      ## Definition of Done
      - [ ] Specs reviewed and approved
      - [ ] All requirements have acceptance criteria
      - [ ] Tasks are atomic and verifiable
      - [ ] Implementation follows plan

  - type: write
    description: Create spec.md
    path: "specs/{{name}}/spec.md"
    content: |
      # Specification: {{task}}

      ## Overview
      {{task}}

      ## Functional Requirements

      {{#if from_content}}
      Based on the source file content, the following requirements are identified:

      **IMPORTANT**: If the source file contains requirement IDs (e.g., REQ-AUTH-001, C-01),
      preserve them exactly. Do NOT renumber.
      {{/if}}

      ### REQ-{{name}}-001: Core Functionality
      **User Story**: As a user, I want core {{name}} functionality
      **Acceptance Criteria**:
      - WHEN user requests {{name}} THEN system SHALL provide it

      ## Non-Functional Requirements
      - Performance: Response time < 200ms
      - Security: Authentication required

      ## Out of Scope
      - To be determined

  - type: write
    description: Create requirements.md
    path: "specs/{{name}}/requirements.md"
    content: |
      # Requirements: {{task}}

      ## Functional Requirements

      {{#if from_content}}
      Based on the source file content, the following requirements are identified:

      - [ ] REQ-{{name}}-001: Core functionality
      {{else}}
      - [ ] REQ-{{name}}-001: Core functionality
      - [ ] REQ-{{name}}-002: User management
      - [ ] REQ-{{name}}-003: Data persistence
      {{/if}}

      ## Non-Functional Requirements
      - [ ] Performance: Response time < 200ms
      - [ ] Scalability: Support 1000+ concurrent users
      - [ ] Security: Authentication required for all operations

  - type: write
    description: Create plan.md
    path: "specs/{{name}}/plan.md"
    content: |
      # Implementation Plan: {{task}}

      ## Architecture
      To be determined during detailed planning phase.

      ## Implementation Phases

      ### Phase 1: Foundation
      **Build Gate**: `cargo build`
      **Verify Gate**: `cargo test`
      - Set up module structure
      - Implement core functionality

      ### Phase 2: Features
      **Build Gate**: `cargo build`
      **Verify Gate**: `cargo test`
      - Implement user management
      - Add data persistence

  - type: write
    description: Create tasks.md
    path: "specs/{{name}}/tasks.md"
    content: |
      # Tasks: {{task}}

      ## Phase 1: Foundation

      - [T001] [Module] Implement {{name}} module — L (REQ-{{name}}-001)
        **Build**: `cargo build`
        **Verify**: specs/{{name}}/ tests pass
        **Gate**: must pass before next task

      ## Phase 2: Features

      - [T002] Implement user management — M
        **Build**: `cargo build`
        **Verify**: `cargo test`
        **Gate**: must pass before next task

  - type: write
    description: Append module entry to root spec.md
    path: "specs/spec.md"
    content: |
      # Spec

      ## Functional Requirements

      ### REQ-{{name}}: [{{name}}] Module
      **User Story**:
      > As a developer, I want a {{name}} module so that I can organize {{name}} functionality

      **Implementation Notes**: Implemented in specs/{{name}}/

      ---

  - type: write
    description: Append module task to root tasks.md
    path: "specs/tasks.md"
    content: |
      # Tasks

      ## Phase 1: Implementation

      - [T001] [Module] Implement {{name}} module — L (REQ-{{name}})
        **Build**: `cargo build`
        **Verify**: specs/{{name}}/ tests pass
        **Gate**: must pass before next task

  - type: action
    description: Record in memory
    cmd: ["dectl", "memory", "add", "Specs written for module: {{task}}", "--tags", "specs,module,{{task_id}}"]

  - type: prompt
    description: Summary
    run_always: true
    content: |
      ## Module Spec Writing Complete

      **Task**: {{task}}

      ### Files created:
      Check `specs/{{name}}/` for the SDD documents.

      ### Root files updated:
      - `specs/spec.md` — module entry appended
      - `specs/tasks.md` — module task appended

      ### Next steps:
      1. Review the generated specs
      2. Implement tasks via: `dectl workflow run execute_task --var task_id=<ID> --auto`
