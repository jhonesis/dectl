name: documenter
role: "Task cycle closer: document, register, and update project state"
description: >
  Documentation phase: read review results, register decision in memory,
  update progress state, write session summary, and close the task cycle.
  Final step in the SDD pipeline. Runs after reviewer (even on failure via run_always).
  Note: Agents are fault-tolerant and non-blocking. Documenter always executes
  to ensure task is recorded, regardless of prior agent outcomes.
requires:
  - reviewer
context_files:
  - ".dec/config/project.toml"
  - ".dec/state/progress.json"
next_step_hint: "Review the workflow verdict for {{task_id}}; only a PASS closes the task."
steps:
  - type: action
    description: Read review results
    shell: true
    cmd: ["cat .dec/agent-output/{{task_id}}-review.md 2>/dev/null || echo 'No review report found'"]

  - type: action
    description: Read research context
    shell: true
    cmd: ["head -50 .dec/agent-output/{{task_id}}-research.md 2>/dev/null || echo 'No research context'"]

  - type: action
    description: Get current timestamp
    shell: true
    cmd: ["date -u '+%Y-%m-%dT%H:%M:%SZ'"]

  - type: action
    description: Save task attempt to memory before review verdict
    cmd: ["dectl", "memory", "add", "Task attempt {{task_id}}: {{task}} — final review verdict pending; see .dec/agent-output/{{task_id}}-*", "--tags", "implementation,attempt,{{task_id}}"]

  - type: action
    description: Save implementation notes for the task attempt
    cmd: ["dectl", "memory", "add", "Implementation notes for attempt {{task_id}}: {{task}} — see .dec/agent-output/{{task_id}}-*", "--tags", "implementation,attempt,{{task_id}}"]

  - type: write
    description: Write task completion summary
    path: ".dec/agent-output/{{task_id}}-summary.md"
    content: |
      # Task Cycle Attempt: {{task_id}}
      ## Description: {{task}}
      ## Recorded: {{step_3_output}}

      ### Review Results
      {{step_1_output}}

      ### Original Research
      {{step_2_output}}

      ### Pipeline Artifacts
      - Research: `.dec/agent-output/{{task_id}}-research.md`
      - Coder context: `.dec/agent-output/{{task_id}}-coder-context.md`
      - Review: `.dec/agent-output/{{task_id}}-review.md`
      - Summary: `.dec/agent-output/{{task_id}}-summary.md`

  - type: action
    description: List all task artifacts
    shell: true
    cmd: ["ls -la .dec/agent-output/{{task_id}}-* 2>/dev/null || echo 'No artifacts'"]

  - type: prompt
    description: Documentation and state update instructions
    run_always: true
    content: |
      ## Documentation: {{task}}
      **Task ID**: {{task_id}}

      ### Already done automatically:
      - Memory updated with implementation record
      - Memory updated with technical decisions
      - Task summary written to `.dec/agent-output/{{task_id}}-summary.md`

       ### Required verdict file
       Review the reviewer analysis, spec findings, build/test/lint outputs, and rules gate.
       Write `.dec/agent-output/{{task_id}}-review-status.txt` with exactly `PASS` or
       `FAIL` on its first line; include a brief reason on following lines.
       Use `PASS` only if all required checks pass and no blocker remains. Any failed
       check, unresolved blocker, or uncertainty is `FAIL`.

       ### Documentation tasks for PASS
       1. Update/add the progress entry as `done` and refresh `updated_at`.
       2. Mark the matching task `[x]` if it exists in `tasks.md`.
       3. Add a completion entry to `last_session.md` and a completion memory entry.
       4. Add a decision file only when the implementation made an architectural decision.

       ### Documentation tasks for FAIL
       1. Keep/add the progress entry as `in_progress`; never leave it `done`.
       2. Keep the matching `tasks.md` checkbox `[ ]` if it exists; never check it.
       3. Record the failed attempt and reason in `last_session.md` and memory, without
         saying the task completed. Preserve the review report and all attempt artifacts.

      ### Task artifacts for reference:
      {{step_7_output}}

      ### Task cycle complete
      To verify everything was recorded:
        dectl memory search "{{task_id}}" --json

  - type: prompt
    description: Update progress.json
    run_always: true
    content: |
      ## Update progress.json according to the recorded review verdict

      Read `.dec/agent-output/{{task_id}}-review-status.txt` first.
      - For `PASS`, set the task status to `done`.
      - For `FAIL`, set it to `in_progress`; never mark it `done`.
      In either case, preserve other entries and update the global `updated_at`.

      1. Read the current file.
      2. For task {{task_id}}:
         - If an entry with this `id` already exists in the `features` array, update its status according to the verdict.
         - If it does NOT exist, add a new entry to the `features` array with:
           - `id`: "{{task_id}}"
           - `description`: a short summary of the task attempt ({{task}})
           - `status`: `"done"` for PASS or `"in_progress"` for FAIL
      3. Update the global `updated_at` timestamp to the current time (ISO 8601 UTC).
      4. Preserve the `_comment`, `schema_version`, and ALL other existing entries exactly as they are.
      5. Verify the file is valid JSON after your edit.

  - type: prompt
    description: Update last_session.md
    run_always: true
    content: |
      ## Update last_session.md according to the review verdict

      Read `.dec/agent-output/{{task_id}}-review-status.txt`. For PASS, record
      completion. For FAIL, record an attempted task and the review failure; do
      not list it among completed tasks.

      1. Read the current session log.
      2. Update the session date at the top to the current time.
      3. Append a bullet under "What was done" that accurately reflects PASS or FAIL:
        - PASS: "- {{task_id}} completed: {{task}}"
        - FAIL: "- {{task_id}} attempted; review failed: {{task}}"
      4. Do NOT overwrite the entire file. Preserve the history of ALL other tasks completed in this session.
      5. If relevant, update the "What's pending" and "Recommended next step" sections.

  - type: prompt
    description: Update tasks.md checkbox
    run_always: true
    content: |
      ## Update tasks.md checkbox according to the review verdict

      Read `.dec/agent-output/{{task_id}}-review-status.txt`. Mark `[x]` only for
      PASS. For FAIL, leave or restore `[ ]`; the loop must not advance this task.

      1. Check whether a `tasks.md` exists in the project:
         run `find . -name "tasks.md" -type f 2>/dev/null | head -5`
      2. If NO tasks.md exists, SKIP this step.
      3. If it exists, open it and find the line referencing task {{task_id}}.
      4. If the task IS listed there, change `- [ ]` to `- [x]` for that task and verify with:
            grep -n "\[x\]" <the tasks.md file>
      5. If the task is NOT listed there, SKIP — the task lives outside the specs index (different nomenclature or scope).

  - type: prompt
    description: Register accepted rules violations in decisions/
    run_always: true
    content: |
      ## Register rules exceptions: {{task}}
      **Task ID**: {{task_id}}

      If the reviewer reported a blocking-set violation (REQ-rules-007) that the
      user EXPLICITLY accepted as a justified exception, record it as a decision
      file — otherwise SKIP this step (never invent exceptions):

      1. Check the review report `.dec/agent-output/{{task_id}}-review.md` for a
         `RULES_GATE: FAIL` closed as accepted, or a user message accepting it.
      2. If accepted, write `.dec/decisions/{{task_id}}-rules-exception.md`:
         - Which rule ID was violated (e.g. `13.1`) and where (files/lines)
         - The justification given by the user (verbatim when possible)
         - Why the gate verdict is overruled for this task only
      3. If no violation was accepted, do nothing — an empty `decisions/`
         entry is worse than none.

  - type: prompt
    description: Pipeline completion notice
    run_always: true
    content: |
      ---
      ## SDD Task Cycle for {{task_id}}

      Pipeline: researcher -> coder -> reviewer -> documenter

      Review verdict: read `.dec/agent-output/{{task_id}}-review-status.txt`.
      PASS means the task is complete. FAIL means the attempt is recorded and the
      task remains open for correction. All artifacts are in `.dec/agent-output/{{task_id}}-*`.

      To finish the workflow state gate, resume from step 7 as instructed.
