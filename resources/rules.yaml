# rules.yaml — schema_version: 2
#
# MACHINE-READABLE source of truth for the development rules compendium.
# Generated from development-rules.md (the HUMAN-READABLE source).
#
# SCHEMA CHANGES relative to schema_version 1 (external technical review):
#
#   1. `profile` was REMOVED from the root. Every activation condition goes
#      through `requires` (an AND list): empty = transversal, one entry =
#      simple profile, two or more = composite condition (e.g. "13.3" needs
#      has_auth AND has_web_ui). A single evaluation path in the resolver.
#
#   2. `primary_flag` is NEW metadata, organization-only — it does NOT take
#      part in activation logic (that lives 100% in `requires`). It tells
#      `dectl spec init` which .dec/rules/profiles/{flag}.yaml file to
#      materialize the rule into. null = goes in transversal.yaml.
#
#   3. `action` and `exception` now ALWAYS mean the same thing, regardless
#      of `severity`:
#        - action    = what SHOULD be done (the recommended practice)
#        - exception = the antipattern to avoid, when one is relevant
#      Before, in the 9 rules with severity: AVOID, `action` described the
#      bad practice instead of the good one — inconsistent with the
#      MUST/SHOULD rules. Fixed in the 9 affected rules.
#
#   4. Severity-to-reviewer-behavior mapping (documented here, no parser
#      effect; see rules-integration-guide.md section 7):
#        MUST   -> blocks the pipeline when `action` is not met (error)
#        SHOULD -> non-blocking warning when `action` is not met
#        AVOID  -> blocks when the `exception` pattern is found in the diff
#
# Fields per rule:
#   id            -> section.index, positional, matches development-rules.md
#   section       -> human-readable category name
#   severity      -> MUST | SHOULD | AVOID (enforcement level, see above)
#   primary_flag  -> null | flag name, ONLY for file organization
#   requires      -> list of {flag, equals} in AND; empty = always active
#   condition     -> the IF, in plain text
#   action        -> the THEN — ALWAYS the recommended practice
#   why           -> brief justification, or null
#   exception     -> the antipattern to avoid, or null
#   tags          -> keywords for `dectl rules search`
#   cross_referenced_by -> other profiles pointing at this rule without duplicating it

