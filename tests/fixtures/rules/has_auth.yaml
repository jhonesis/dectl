# .dec/rules/profiles/has_auth.yaml — schema_version 2
# Materialized by `dectl spec init` ONLY when has_auth = true.
# Each rule's real activation lives in its own `requires` field
# (not in this file name) — this is just physical grouping.

version: 2
profile_flag: has_auth
source_rule_ids:
- '13.3'
- '13.4'
- '13.5'
- '13.7'
- '13.9'
rules:
- id: '13.3'
  section: Security
  severity: MUST
  primary_flag: has_auth
  requires:
  - flag: has_auth
    equals: true
  - flag: has_web_ui
    equals: true
  condition: a backend action mutates data and relies on session cookies
  action: use SameSite=Strict/Lax + anti-CSRF tokens
  why: null
  exception: null
  tags:
  - owasp
  - csrf
  - security
- id: '13.4'
  section: Security
  severity: MUST
  primary_flag: has_auth
  requires:
  - flag: has_auth
    equals: true
  condition: you look up a resource by an ID from the URL/request
  action: also filter by the current session's owner
  why: null
  exception: AVOID trusting the ID alone (IDOR)
  tags:
  - owasp
  - idor
  - security
- id: '13.5'
  section: Security
  severity: SHOULD
  primary_flag: has_auth
  requires:
  - flag: has_auth
    equals: true
  condition: the resource does not belong to the authenticated user
  action: return 404 instead of 403
  why: does not confirm to the attacker that the resource exists
  exception: null
  tags:
  - owasp
  - authorization
- id: '13.7'
  section: Security
  severity: MUST
  primary_flag: has_auth
  requires:
  - flag: has_auth
    equals: true
  condition: you store passwords
  action: use Bcrypt or Argon2 with salt
  why: null
  exception: AVOID MD5/SHA-256 without salt or plain text
  tags:
  - owasp
  - passwords
  - hashing
- id: '13.9'
  section: Security
  severity: SHOULD
  primary_flag: has_auth
  requires:
  - flag: has_auth
    equals: true
  condition: you manage session tokens
  action: use short-lived tokens with renewal (refresh token)
  why: null
  exception: AVOID sessions that never expire
  tags:
  - owasp
  - sessions
  - tokens
