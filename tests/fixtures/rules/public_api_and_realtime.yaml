rules:
- id: '11.3'
  section: API Architecture
  severity: SHOULD
  primary_flag: public_api
  requires:
  - flag: public_api
    equals: true
  condition: you connect internal microservices with maximum speed and strict typing
  action: use gRPC
  why: null
  exception: AVOID exposing it directly to browsers or as a public API without a translation proxy
  tags:
  - apis
  - grpc
- id: '11.4'
  section: API Architecture
  severity: SHOULD
  primary_flag: public_api
  requires:
  - flag: public_api
    equals: true
  - flag: realtime
    equals: true
  condition: you need bidirectional real-time communication (chat, live notifications)
  action: use WebSockets
  why: null
  exception: AVOID using them for one-off/sporadic reads (they waste sockets and memory)
  tags:
  - apis
  - websockets
  - realtime

  cross_referenced_by:
  - realtime
- id: '11.6'
  section: API Architecture
  severity: MUST
  primary_flag: public_api
  requires:
  - flag: public_api
    equals: true
  condition: you expose an endpoint with a POST method that creates a resource (e.g. a purchase)
  action: prevent duplicate retries
  why: null
  exception: AVOID assuming retrying a POST is safe, since it can duplicate orders/charges
  tags:
  - apis
  - idempotencia
  - post


